# ウォッチリスト。ティッカーの追加・削除はこのファイルを手で編集する。
# 価格は書かない。画面の数字は日足から計算する。
#
# ticker       必須。米国ティッカー
# description  必須。一行の説明
# notes        任意。連動メモやイベント
# tags         任意。高ボラ / 増資枠 / 合併 / 売出予定 / 事業分離 など
# watchOnly    true で「監視のみ」（目安は1株が約$450超）
# earnings.date    YYYY-MM-DD。季節が変わったら手で更新する
# earnings.status  confirmed（確）または estimated（推定）

