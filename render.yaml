services:
  - type: web
    name: range-table
    runtime: node
    buildCommand: npm ci && npm run build
    # 384MB old-space leaves headroom under the free plan's 512MB container limit.
    startCommand: node --max-old-space-size=384 node_modules/next/dist/bin/next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /api/health
    # Deploy a main commit only after its GitHub checks (CI) pass.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      # Private holdings JSON. Set in the Render Dashboard; never committed.
      - key: HOLDINGS_JSON
        sync: false
      # "range-table <contact email>". SEC rejects requests without a contact email.
      - key: SEC_USER_AGENT
        sync: false
      # Opens the read-only holdings tab (8+ characters). Without it the tab stays closed.
      - key: HOLDINGS_PASSCODE
        sync: false
      # Bearer token (16+ characters) for review-line alerts in /api/alerts and for /api/precheck.
      - key: ALERTS_TOKEN
        sync: false
